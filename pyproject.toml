[project]
name = "diandianreading"
version = "0.1.0"
description = "Local-first AI reading and knowledge workspace"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "diandianreading contributors" }]
dependencies = [
    "fastapi>=0.116,<1",
    "notebooklm-py==0.8.0rc1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
notebooklm-login = ["notebooklm-py[browser]==0.8.0rc1"]
zlibrary = ["playwright==1.61.0"]
desktop-sidecar = [
    "notebooklm-py[browser]==0.8.0rc1",
    "playwright==1.61.0",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
diandianreading = "diandianreading.interfaces.cli:main"
diandian = "diandianreading.interfaces.cli:main"
diandian-desktop-sidecar = "diandianreading.interfaces.desktop_sidecar:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "mypy>=1.15,<2",
    "pyinstaller==6.14.1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diandianreading"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/pyproject.toml",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=src/diandianreading",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "e2e: local end-to-end tests that exercise process and persistence boundaries",
]
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning',
]

[tool.coverage.run]
source = ["src/diandianreading"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]

[tool.mypy]
python_version = "3.11"
files = ["src/diandianreading"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Chinese prompt templates sent to the provider. Fullwidth punctuation is correct
# typography for the target language, not an ambiguous-character mistake.
"src/diandianreading/application/use_cases/content_generation.py" = ["RUF001"]
# Chinese placeholder text written into the user's Obsidian vault; fullwidth
# punctuation is correct typography for the target language.
"src/diandianreading/interfaces/web/app.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["diandianreading"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
