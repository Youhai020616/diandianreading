[project]
name = "diandianreading"
version = "0.1.0"
description = "Local-first AI reading and knowledge workspace"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "diandianreading contributors" }]
dependencies = ["notebooklm-py==0.8.0rc1"]

[project.scripts]
diandian = "diandianreading.interfaces.cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diandianreading"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/pyproject.toml",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["source/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=src/diandianreading",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
markers = [
    "e2e: local end-to-end tests that exercise process and persistence boundaries",
]

[tool.coverage.run]
source = ["src/diandianreading"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]

[tool.mypy]
python_version = "3.11"
files = ["src/diandianreading"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["diandianreading"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
