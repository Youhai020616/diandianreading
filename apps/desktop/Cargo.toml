[workspace]
resolver = "2"
members = ["launcher-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
launcher-core = { path = "launcher-core" }
serde_json = "1.0.145"

[profile.release]
# Unwinding is kept on purpose: SupervisedChild reaps the sidecar in Drop, and
# `panic = "abort"` would skip that and leave an orphan behind.
codegen-units = 1
lto = true
strip = true
