name: Provider auth checks

on:
  push:
    branches: [main]
    paths:
      - "source/notebooklm-py/**"
      - "source/zlibrary-to-notebooklm/**"
      - ".github/workflows/provider-auth.yml"
  pull_request:
    paths:
      - "source/notebooklm-py/**"
      - "source/zlibrary-to-notebooklm/**"
      - ".github/workflows/provider-auth.yml"
  workflow_dispatch:

concurrency:
  group: provider-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notebooklm-login:
    name: NotebookLM login unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install locked test environment
        working-directory: source/notebooklm-py
        run: uv sync --locked --extra browser --extra dev --extra markdown

      - name: Run login tests without launching a browser
        working-directory: source/notebooklm-py
        run: >-
          uv run --locked pytest
          tests/unit/cli/test_login.py
          tests/unit/cli/test_playwright_login_render_contract.py
          -q

  zlibrary-login:
    name: Z-Library login unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install hashed login test dependencies
        run: >-
          uv pip install --system --require-hashes
          -r source/zlibrary-to-notebooklm/requirements-ci.lock

      - name: Run argument and session-safety tests
        working-directory: source/zlibrary-to-notebooklm
        run: python -m unittest discover -s tests -p test_login_args.py -v
