name: Distribution preview

on:
  workflow_dispatch:
    inputs:
      create_github_prerelease:
        description: Create a GitHub pre-release from an existing immutable version tag
        required: true
        type: boolean
        default: false
      tag:
        description: Existing tag (must equal v<project version> and point at this commit)
        required: false
        type: string

concurrency:
  group: distribution-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke distribution artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Build and verify the React UI
        working-directory: apps/web
        run: |
          npm install -g pnpm@10.26.2
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Verify committed Web assets
        run: |
          rm -rf src/diandianreading/interfaces/web/static
          mkdir -p src/diandianreading/interfaces/web/static
          cp -r apps/web/dist/. src/diandianreading/interfaces/web/static/
          git diff --exit-code -- src/diandianreading/interfaces/web/static

      - name: Install locked build and test dependencies
        run: uv sync --locked --all-groups

      - name: Run Python quality gates
        run: |
          uv lock --check
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked python tests/markdown_link_smoke.py
          uv run --locked mypy src/diandianreading
          uv run --locked pytest -q

      - name: Build wheel and sdist
        run: uv build --no-build-isolation

      - name: Validate contents and write release manifest
        run: >-
          uv run --locked python tests/distribution_artifact_smoke.py
          --wheel dist/diandianreading-*.whl
          --sdist dist/diandianreading-*.tar.gz
          --output dist/release-manifest.json

      - name: Smoke local wheel through uvx outside the source tree
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.tmp/release-uvx-cache
          UV_TOOL_DIR: ${{ github.workspace }}/.tmp/release-uvx-tools
        run: |
          mapfile -t wheels < <(compgen -G 'dist/*.whl')
          test "${#wheels[@]}" -eq 1
          mkdir -p .tmp/release-uvx-work
          python tests/web_process_smoke.py \
            --command uvx \
            --command-arg=--from \
            --command-arg="$GITHUB_WORKSPACE/${wheels[0]}" \
            --command-arg=diandianreading \
            --working-directory .tmp/release-uvx-work \
            --start-timeout 180 \
            --home .tmp/release-uvx-home

      - name: Upload immutable candidate files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diandianreading-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  github-prerelease:
    name: Create GitHub pre-release
    if: inputs.create_github_prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag and package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as source:
              print(tomllib.load(source)["project"]["version"])
          PY
          )
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diandianreading-${{ github.sha }}
          path: release-files

      - name: Create pre-release without publishing to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-files/*
          --prerelease
          --verify-tag
          --generate-notes
          --title "diandianreading $RELEASE_TAG (preview)"
