name: Publish TestPyPI preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag matching v<project version>
        required: true
        type: string
      confirmation:
        description: Type publish-testpypi to confirm the public preview upload
        required: true
        type: string

concurrency:
  group: publish-testpypi-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build tagged distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "publish-testpypi"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Verify tag, version, and clean checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as source:
              print(tomllib.load(source)["project"]["version"])
          PY
          )
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Verify and build with locked tools
        run: |
          uv sync --locked --all-groups
          uv lock --check
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked python tests/markdown_link_smoke.py
          uv run --locked mypy src/diandianreading
          uv run --locked pytest -q
          uv build --no-build-isolation

      - name: Validate distribution contents
        run: >-
          uv run --locked python tests/distribution_artifact_smoke.py
          --wheel dist/diandianreading-*.whl
          --sdist dist/diandianreading-*.tar.gz
          --output dist/release-manifest.json

      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testpypi-${{ inputs.tag }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Trusted publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/diandianreading/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testpypi-${{ inputs.tag }}
          path: candidate

      - name: Publish wheel and sdist with OIDC (no API token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: candidate
          print-hash: true
          skip-existing: false
          verbose: true
