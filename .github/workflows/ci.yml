name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, build, and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Build and test web UI
        working-directory: apps/web
        run: |
          npm install -g pnpm@10.26.2
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Verify committed web assets match the build
        run: |
          rm -rf src/diandianreading/interfaces/web/static
          mkdir -p src/diandianreading/interfaces/web/static
          cp -r apps/web/dist/. src/diandianreading/interfaces/web/static/
          git diff --exit-code -- src/diandianreading/interfaces/web/static
          test -z "$(git status --porcelain -- src/diandianreading/interfaces/web/static)"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Type check
        run: uv run --locked mypy src/diandianreading

      - name: Build distributions from locked build tools
        run: uv build --no-build-isolation

      - name: Install built wheel in an isolated environment
        run: |
          uv venv --python 3.12 .tmp/ci-wheel-venv
          uv pip install \
            --python .tmp/ci-wheel-venv/bin/python \
            ./dist/diandianreading-0.1.0-py3-none-any.whl

      - name: Run installed-wheel Phase 0 migration and import smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase0-e2e
          --database .tmp/ci-wheel/phase0/app.sqlite3
          --workspace .tmp/ci-wheel/phase0/workspace

      - name: Run installed-wheel Phase 1 document-processing smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase1-e2e
          --database .tmp/ci-wheel/phase1/app.sqlite3
          --object-root .tmp/ci-wheel/phase1/objects
          --workspace .tmp/ci-wheel/phase1/workspace

      - name: Run installed-wheel Phase 2 NotebookLM adapter smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase2-e2e
          --database .tmp/ci-wheel/phase2/app.sqlite3
          --object-root .tmp/ci-wheel/phase2/objects
          --credentials-root .tmp/ci-wheel/phase2/credentials
          --workspace .tmp/ci-wheel/phase2/workspace

      - name: Run installed-wheel Phase 3 recoverable-workflow smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase3-e2e
          --database .tmp/ci-wheel/phase3/app.sqlite3
          --workspace .tmp/ci-wheel/phase3/workspace

      - name: Run installed-wheel Phase 4 governed Z-Library adapter smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase4-e2e
          --database .tmp/ci-wheel/phase4/app.sqlite3
          --object-root .tmp/ci-wheel/phase4/objects
          --credentials-root .tmp/ci-wheel/phase4/credentials
          --workspace .tmp/ci-wheel/phase4/workspace

      - name: Run installed-wheel Phase 5 unified-product smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase5-e2e
          --app-home .tmp/ci-wheel/phase5/app-home
          --workspace .tmp/ci-wheel/phase5/workspace

      - name: Run installed-wheel R1 reading-service smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r1-e2e
          --app-home .tmp/ci-wheel/r1/app-home
          --workspace .tmp/ci-wheel/r1/workspace

      - name: Run installed-wheel R2 annotation smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r2-e2e
          --app-home .tmp/ci-wheel/r2/app-home
          --workspace .tmp/ci-wheel/r2/workspace

      - name: Run installed-wheel R4 chat-scope smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r4-e2e
          --app-home .tmp/ci-wheel/r4/app-home
          --workspace .tmp/ci-wheel/r4/workspace

      - name: Run installed-wheel C1 knowledge-note smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian c1-e2e
          --app-home .tmp/ci-wheel/c1/app-home
          --workspace .tmp/ci-wheel/c1/workspace

      - name: Run installed-wheel C1b content-generation smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian c1b-e2e
          --app-home .tmp/ci-wheel/c1b/app-home
          --workspace .tmp/ci-wheel/c1b/workspace

  desktop-sidecar:
    name: Desktop sidecar artifact (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install locked sidecar dependencies
        run: uv sync --locked --all-groups --extra desktop-sidecar

      - name: Check sidecar build tooling
        run: |
          uv run --locked ruff format --check packaging/sidecar
          uv run --locked ruff check packaging/sidecar

      - name: Provision the bundled Chromium runtime
        run: >-
          uv run --locked --extra desktop-sidecar python packaging/sidecar/provision_browser.py
          --output .tmp/desktop-sidecar-browser

      - name: Build the arm64 sidecar artifact
        run: >-
          uv run --locked --extra desktop-sidecar python packaging/sidecar/build.py
          --output .tmp/desktop-sidecar-artifact
          --browser-root .tmp/desktop-sidecar-browser

      - name: Smoke test the artifact without a system Python runtime
        run: >-
          uv run --locked python packaging/sidecar/smoke_artifact.py
          --artifact .tmp/desktop-sidecar-artifact/diandian-desktop-sidecar

  desktop-launcher:
    name: Desktop launcher core (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # launcher-core carries every security-relevant launcher decision and has no
      # Tauri dependency, so it is checked here without WebKit system libraries.
      - name: Check formatting
        working-directory: apps/desktop
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: apps/desktop
        run: cargo clippy -p launcher-core --all-targets --locked -- -D warnings

      - name: Test
        working-directory: apps/desktop
        run: cargo test -p launcher-core --locked

  desktop-shell:
    name: Desktop shell bundle (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install locked sidecar dependencies
        run: uv sync --locked --all-groups --extra desktop-sidecar

      - name: Provision the bundled Chromium runtime
        run: >-
          uv run --locked --extra desktop-sidecar python packaging/sidecar/provision_browser.py
          --output .tmp/shell-browser

      - name: Build the sidecar artifact
        run: >-
          uv run --locked --extra desktop-sidecar python packaging/sidecar/build.py
          --output .tmp/shell-artifact
          --browser-root .tmp/shell-browser

      - name: Stage the sidecar as a bundle resource
        run: |
          mkdir -p apps/desktop/src-tauri/resources
          mv .tmp/shell-artifact/diandian-desktop-sidecar apps/desktop/src-tauri/resources/sidecar
          test -x apps/desktop/src-tauri/resources/sidecar/diandian-desktop-sidecar

      - name: Cache the pinned Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.11.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install the pinned Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.11.4 --locked

      # Bundle targets are pinned in tauri.conf.json, so no CLI target flag is needed.
      - name: Build the unsigned desktop bundle
        working-directory: apps/desktop
        run: cargo tauri build

      - name: Verify the bundle carries the fixed sidecar
        run: |
          APP=apps/desktop/target/release/bundle/macos/diandianreading.app
          test -d "$APP"
          test -x "$APP/Contents/Resources/sidecar/diandian-desktop-sidecar"
          test -f "$APP/Contents/Resources/sidecar/sidecar-manifest.json"
          test -d "$APP/Contents/Resources/sidecar/_internal"

      # smoke_artifact.py takes the onedir artifact directory, not the executable.
      - name: Smoke test the sidecar inside the bundle
        run: >-
          uv run --locked python packaging/sidecar/smoke_artifact.py
          --artifact apps/desktop/target/release/bundle/macos/diandianreading.app/Contents/Resources/sidecar

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run unit, contract, integration, and local E2E tests
        run: uv run --locked pytest
