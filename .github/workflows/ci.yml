name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, build, and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Build and test web UI
        working-directory: apps/web
        run: |
          npm install -g pnpm@10.26.2
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Verify committed web assets match the build
        run: |
          rm -rf src/diandianreading/interfaces/web/static
          mkdir -p src/diandianreading/interfaces/web/static
          cp -r apps/web/dist/. src/diandianreading/interfaces/web/static/
          git diff --exit-code -- src/diandianreading/interfaces/web/static
          test -z "$(git status --porcelain -- src/diandianreading/interfaces/web/static)"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format --check src tests

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Check relative Markdown links
        run: uv run --locked python tests/markdown_link_smoke.py

      - name: Type check
        run: uv run --locked mypy src/diandianreading

      - name: Build distributions from locked build tools
        run: uv build --no-build-isolation

      - name: Verify distribution contents and generate hashes
        run: >-
          uv run --locked python tests/distribution_artifact_smoke.py
          --wheel dist/diandianreading-0.1.0-py3-none-any.whl
          --sdist dist/diandianreading-0.1.0.tar.gz
          --output dist/release-manifest.json

      - name: Install built wheel in an isolated environment
        run: |
          uv venv --python 3.12 .tmp/ci-wheel-venv
          uv pip install \
            --python .tmp/ci-wheel-venv/bin/python \
            ./dist/diandianreading-0.1.0-py3-none-any.whl

      - name: Run installed-wheel real Web process smoke
        run: >-
          python tests/web_process_smoke.py
          --command .tmp/ci-wheel-venv/bin/diandianreading
          --home .tmp/ci-wheel/web/app-home

      - name: Run local-wheel uvx process smoke outside the source tree
        env:
          UV_CACHE_DIR: ${{ github.workspace }}/.tmp/ci-uvx-cache
          UV_TOOL_DIR: ${{ github.workspace }}/.tmp/ci-uvx-tools
        run: |
          mkdir -p .tmp/ci-uvx-work
          python tests/web_process_smoke.py \
            --command uvx \
            --command-arg=--from \
            --command-arg="$GITHUB_WORKSPACE/dist/diandianreading-0.1.0-py3-none-any.whl" \
            --command-arg=diandianreading \
            --working-directory .tmp/ci-uvx-work \
            --start-timeout 180 \
            --home .tmp/ci-uvx/app-home

      - name: Run installed-wheel Phase 0 migration and import smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase0-e2e
          --database .tmp/ci-wheel/phase0/app.sqlite3
          --workspace .tmp/ci-wheel/phase0/workspace

      - name: Run installed-wheel Phase 1 document-processing smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase1-e2e
          --database .tmp/ci-wheel/phase1/app.sqlite3
          --object-root .tmp/ci-wheel/phase1/objects
          --workspace .tmp/ci-wheel/phase1/workspace

      - name: Run installed-wheel Phase 2 NotebookLM adapter smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase2-e2e
          --database .tmp/ci-wheel/phase2/app.sqlite3
          --object-root .tmp/ci-wheel/phase2/objects
          --credentials-root .tmp/ci-wheel/phase2/credentials
          --workspace .tmp/ci-wheel/phase2/workspace

      - name: Run installed-wheel Phase 3 recoverable-workflow smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase3-e2e
          --database .tmp/ci-wheel/phase3/app.sqlite3
          --workspace .tmp/ci-wheel/phase3/workspace

      - name: Run installed-wheel Phase 4 governed Z-Library adapter smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase4-e2e
          --database .tmp/ci-wheel/phase4/app.sqlite3
          --object-root .tmp/ci-wheel/phase4/objects
          --credentials-root .tmp/ci-wheel/phase4/credentials
          --workspace .tmp/ci-wheel/phase4/workspace

      - name: Run installed-wheel Phase 5 unified-product smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian phase5-e2e
          --app-home .tmp/ci-wheel/phase5/app-home
          --workspace .tmp/ci-wheel/phase5/workspace

      - name: Run installed-wheel R1 reading-service smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r1-e2e
          --app-home .tmp/ci-wheel/r1/app-home
          --workspace .tmp/ci-wheel/r1/workspace

      - name: Run installed-wheel R2 annotation smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r2-e2e
          --app-home .tmp/ci-wheel/r2/app-home
          --workspace .tmp/ci-wheel/r2/workspace

      - name: Run installed-wheel R4 chat-scope smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian r4-e2e
          --app-home .tmp/ci-wheel/r4/app-home
          --workspace .tmp/ci-wheel/r4/workspace

      - name: Run installed-wheel C1 knowledge-note smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian c1-e2e
          --app-home .tmp/ci-wheel/c1/app-home
          --workspace .tmp/ci-wheel/c1/workspace

      - name: Run installed-wheel C1b content-generation smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian c1b-e2e
          --app-home .tmp/ci-wheel/c1b/app-home
          --workspace .tmp/ci-wheel/c1b/workspace

      - name: Run installed-wheel C2 obsidian-export smoke
        run: >-
          .tmp/ci-wheel-venv/bin/diandian c2-e2e
          --app-home .tmp/ci-wheel/c2/app-home
          --workspace .tmp/ci-wheel/c2/workspace

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          version: "0.8.15"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run unit, contract, integration, and local E2E tests
        run: uv run --locked pytest
